<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 2px; color: #555; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; }
    button { margin-top: 10px; padding: 6px 10px; font: inherit; cursor: pointer; }
    #status { margin-top: 10px; padding: 8px; background: #f4f4f5; border-radius: 4px; white-space: pre-wrap; font-size: 12px; }
    .ok { color: #0a7d32; } .bad { color: #b00020; }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <h1>fomo-agent collector</h1>
  <label>Receiver endpoint</label>
  <input id="endpoint" placeholder="http://127.0.0.1:8787/ingest" />
  <label>Shared token (optional)</label>
  <input id="token" placeholder="matches RECEIVER_TOKEN in .env" />
  <div class="row">
    <div style="flex:1"><label>Every (minutes)</label><input id="intervalMinutes" type="number" min="1" /></div>
    <div style="flex:1"><label>Wallets per run</label><input id="resolveTop" type="number" min="1" /></div>
  </div>
  <label class="row" style="margin-top:8px"><input id="enabled" type="checkbox" style="width:auto" />&nbsp;run on a schedule</label>
  <label class="row"><input id="withPositions" type="checkbox" style="width:auto" />&nbsp;also collect per-token positions</label>
  <button id="save">Save</button>
  <button id="now">Collect now</button>
  <button id="forget" title="Re-resolve wallets that were already sent">Forget resolved</button>
  <div id="status">…</div>
  <script src="popup.js"></script>
</body>
</html>
