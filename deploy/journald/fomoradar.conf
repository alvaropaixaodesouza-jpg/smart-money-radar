# Every service here logs to the journal, and the RPC tracker is chatty. Uncapped, that grows
# without bound on a box whose whole job is to keep a database. A gigabyte is about a month of
# this workload, which is longer than anybody will ever look back.
#
# Goes in /etc/systemd/journald.conf.d/ ; systemctl restart systemd-journald to apply.
[Journal]
SystemMaxUse=1G
MaxRetentionSec=30day
